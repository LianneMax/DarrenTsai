<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-64.png" sizes="64x64" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Free mortgage calculator: monthly principal and interest, estimated APR, total interest, payoff date and a full amortization schedule. From Darren Tsai, a licensed mortgage broker serving AZ, CA, FL, HI, OR, PA, TN and TX." />
    <link rel="canonical" href="https://realdarrentsai.com/mortgage-calculator/" />
    <title>Mortgage Calculator | Darren Tsai</title>

    <!-- Requested here rather than via an @import in index.css, which the
         browser could not discover until the stylesheet had downloaded and
         parsed. Weights trimmed from 7 to the 5 the site actually uses. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" />

    <!-- Must run before any form handler can submit. ~2KB, no network work. -->
    <script src="/attribution.js"></script>
    <script src="/booking-chooser.js"></script>
    <script src="/email-suggest.js"></script>

    <!-- CallRail Dynamic Number Insertion: swaps the business number for the
         visitor's pool number. Loaded here rather than at the end of <body>
         because the static number is visible and dialable from first paint;
         a call placed in that window is attributed to the wrong pool, or to
         no campaign at all. swap.js is small and non-blocking to parse. -->
    <script type="text/javascript" src="//cdn.callrail.com/companies/650367292/c3023306605245b12c92/12/swap.js"></script>
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N7Z8Q4QF"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div id="root"></div>
    <script type="module" src="/src/mortgage-main.tsx"></script>
  </body>
</html>
