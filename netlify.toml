# Hashed asset filenames change whenever content changes, so they can be cached
# forever. This is the single cheapest repeat-visit win available.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The landing pages are edited by hand and are ad destinations, so they must not
# go stale, but they should still revalidate cheaply rather than refetch.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/attribution.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# The other two shared scripts, on the same terms as attribution.js (audit L4):
# an hour of free repeat views, then a cheap revalidation. They had Netlify's
# default of max-age=0, so every page view refetched or revalidated them.
[[headers]]
  for = "/booking-chooser.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/email-suggest.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Images are not hashed, so not immutable: a week, after which a replaced file
# is picked up. The FHA carousel alone is ~420KB a visitor need not refetch.
[[headers]]
  for = "/fha-illustrations/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/darren-avatar.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
