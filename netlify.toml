[build]
  command = "npm run build"
  publish = "dist"

# NOTE ON ROUTING
# There used to be a catch-all `/* -> /index.html 200` here for SPA routing.
# The app has no router, so it did nothing useful and actively hurt: every
# unknown URL returned the homepage with a 200, which meant scanner probes and
# dead links looked like successful pageviews, real 404s were invisible in
# analytics, and a mistyped Google Ads final URL would silently land on the
# homepage and still pass Ads' landing page checks. Netlify now serves
# public/404.html with a real 404 for unmatched paths.
#
# Netlify functions declare their own routes via `export const config.path`
# (see netlify/functions/*.mts), so /api/* resolves without a redirect here.

# YouTube description and comment links are routed by youtube-redirect.mts.
# The function merges incoming click IDs and UTMs with bucket defaults, using 302.

# The amortization calculator moved off the homepage to its own page, so the
# short /calculator path anyone already types or links stays alive. 302 for the
# same reason the /yt links are: the destination can still change.
[[redirects]]
  from = "/calculator"
  to = "/mortgage-calculator/"
  status = 302

# OLD SITE URLS (audit L2, 30 Sep)
# Google still indexes these from the site that was here before, and reported
# them as "duplicate without canonical" while they 404ed. These are 301, unlike
# everything else in this file, and that is the point: the old pages are gone
# for good, and a permanent redirect is what tells Google to move the old URL's
# standing to the new one and drop it from the index. They are not links we
# will ever want to repoint, which is the only thing the 302s above protect.
# Netlify matches with or without a trailing slash, so /homeowners/ is covered.
[[redirects]]
  from = "/investing"
  to = "/realestateinvesting/"
  status = 301
[[redirects]]
  from = "/investing/*"
  to = "/realestateinvesting/"
  status = 301
[[redirects]]
  from = "/homeowners"
  to = "/"
  status = 301
[[redirects]]
  from = "/agent-career"
  to = "/"
  status = 301
[[redirects]]
  from = "/post/*"
  to = "/"
  status = 301

# Hashed asset filenames change whenever content changes, so they can be cached
# forever. This is the single cheapest repeat-visit win available.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The landing pages are edited by hand and are ad destinations, so they must not
# go stale, but they should still revalidate cheaply rather than refetch.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/attribution.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# The other two shared scripts, on the same terms as attribution.js (audit L4):
# an hour of free repeat views, then a cheap revalidation. They had Netlify's
# default of max-age=0, so every page view refetched or revalidated them.
[[headers]]
  for = "/booking-chooser.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/email-suggest.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Images are not hashed, so not immutable: a week, after which a replaced file
# is picked up. The FHA carousel alone is ~420KB a visitor need not refetch.
[[headers]]
  for = "/fha-illustrations/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/darren-avatar.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Report-only first: inline calculators and vendor integrations must keep
    # working while the resource inventory is narrowed before enforcement.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https:; frame-src https://calendly.com https://www.google.com https://www.youtube.com; object-src 'none'; base-uri 'self'; form-action 'self'"
