[build]
  command = "npm run build"
  publish = "dist"

# NOTE ON ROUTING
# There used to be a catch-all `/* -> /index.html 200` here for SPA routing.
# The app has no router, so it did nothing useful and actively hurt: every
# unknown URL returned the homepage with a 200, which meant scanner probes and
# dead links looked like successful pageviews, real 404s were invisible in
# analytics, and a mistyped Google Ads final URL would silently land on the
# homepage and still pass Ads' landing page checks. Netlify now serves
# public/404.html with a real 404 for unmatched paths.
#
# Netlify functions declare their own routes via `export const config.path`
# (see netlify/functions/*.mts), so /api/* resolves without a redirect here.

# YOUTUBE SHORT LINKS
# One per bucket, plus a -c variant so a description click and a pinned-comment
# click are distinguishable (utm_content). Short enough to read aloud in a video.
#
# These are 302, deliberately. A 301 is cached by the browser permanently, so
# if a link's destination ever changes, everyone who clicked the old one would
# keep landing on the previous page with no way to fix it. The whole point of a
# short link is that the destination can change later.
#
# HELOC and home equity both point at /home-equity/ (revamp phase 3). Until that
# page existed they pointed at the homepage, whose debt-consolidation funnel was
# the nearest offer. The query string is kept, so the YouTube attribution is the
# same either way. Deploy the Apps Script version with the 'home-equity' route
# first: before it, that page's leads are still saved, but on the generic Leads
# tab without their equity columns.
#
# Redirects are evaluated top to bottom, and these must stay above any catch-all
# if one is ever reintroduced.

# The amortization calculator moved off the homepage to its own page, so the
# short /calculator path anyone already types or links stays alive. 302 for the
# same reason the /yt links are: the destination can still change.
[[redirects]]
  from = "/calculator"
  to = "/mortgage-calculator/"
  status = 302

# OLD SITE URLS (audit L2, 30 Sep)
# Google still indexes these from the site that was here before, and reported
# them as "duplicate without canonical" while they 404ed. These are 301, unlike
# everything else in this file, and that is the point: the old pages are gone
# for good, and a permanent redirect is what tells Google to move the old URL's
# standing to the new one and drop it from the index. They are not links we
# will ever want to repoint, which is the only thing the 302s above protect.
# Netlify matches with or without a trailing slash, so /homeowners/ is covered.
[[redirects]]
  from = "/investing"
  to = "/realestateinvesting/"
  status = 301
[[redirects]]
  from = "/investing/*"
  to = "/realestateinvesting/"
  status = 301
[[redirects]]
  from = "/homeowners"
  to = "/"
  status = 301
[[redirects]]
  from = "/agent-career"
  to = "/"
  status = 301
[[redirects]]
  from = "/post/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/yt/heloc"
  to = "/home-equity/?utm_source=youtube&utm_medium=social&utm_campaign=yt-heloc&utm_content=description"
  status = 302
[[redirects]]
  from = "/yt/heloc-c"
  to = "/home-equity/?utm_source=youtube&utm_medium=social&utm_campaign=yt-heloc&utm_content=pinned-comment"
  status = 302

[[redirects]]
  from = "/yt/equity"
  to = "/home-equity/?utm_source=youtube&utm_medium=social&utm_campaign=yt-home-equity&utm_content=description"
  status = 302
[[redirects]]
  from = "/yt/equity-c"
  to = "/home-equity/?utm_source=youtube&utm_medium=social&utm_campaign=yt-home-equity&utm_content=pinned-comment"
  status = 302

# ADU and renovation (revamp phase 5). New bucket, same pattern.
[[redirects]]
  from = "/yt/adu"
  to = "/adu/?utm_source=youtube&utm_medium=social&utm_campaign=yt-adu&utm_content=description"
  status = 302
[[redirects]]
  from = "/yt/adu-c"
  to = "/adu/?utm_source=youtube&utm_medium=social&utm_campaign=yt-adu&utm_content=pinned-comment"
  status = 302

[[redirects]]
  from = "/yt/dscr"
  to = "/dscr/?utm_source=youtube&utm_medium=social&utm_campaign=yt-dscr&utm_content=description"
  status = 302
[[redirects]]
  from = "/yt/dscr-c"
  to = "/dscr/?utm_source=youtube&utm_medium=social&utm_campaign=yt-dscr&utm_content=pinned-comment"
  status = 302

[[redirects]]
  from = "/yt/rei"
  to = "/realestateinvesting/?utm_source=youtube&utm_medium=social&utm_campaign=yt-rei&utm_content=description"
  status = 302
[[redirects]]
  from = "/yt/rei-c"
  to = "/realestateinvesting/?utm_source=youtube&utm_medium=social&utm_campaign=yt-rei&utm_content=pinned-comment"
