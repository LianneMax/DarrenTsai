<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Darren's headshot, resized. The source darren.jpg is a 320x320 PNG at
         134KB and was being served whole as the tab icon on every page; these
         are generated from it by scripts/build-images.mjs. -->
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-64.png" sizes="64x64" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tap into your home equity or finance an investment property with Darren Tsai, a licensed mortgage broker serving AZ, CA, FL, HI, OR, PA, TN and TX. Free calculators and a 15-minute strategy call." />
    <link rel="canonical" href="https://realdarrentsai.com/" />
    <title>Darren Tsai | Home Equity & Investment Property Lending</title>

    <!-- Outfit is self-hosted (audit L4); @font-face is at the top of
         src/index.css. Preloaded so the font request starts with the HTML
         instead of waiting for the stylesheet to be parsed. -->
    <link rel="preload" href="/fonts/outfit-v15-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Records gclid/UTMs and loads GTM. async with high priority (audit L7):
         off the render path, and GTM starts as soon as the file arrives. Every
         reader (form submit, click tracking) checks window.DT at that moment,
         long after this has run. -->
    <script src="/attribution.js" async fetchpriority="high"></script>
    <!-- Deferred (audit L4): only read on a click or a field blur. -->
    <script src="/booking-chooser.js" defer></script>
    <script src="/email-suggest.js" defer></script>

    <!-- CallRail Dynamic Number Insertion: swaps the business number for the
         visitor's pool number. Loaded here rather than at the end of <body>
         because the static number is visible and dialable from first paint;
         a call placed in that window is attributed to the wrong pool, or to
         no campaign at all. swap.js is small and non-blocking to parse. -->
    <script type="text/javascript" src="//cdn.callrail.com/companies/650367292/c3023306605245b12c92/12/swap.js"></script>

    <!-- Calendly is loaded on first click by src/utils/calendly.ts. It used to
         be an eager stylesheet plus script in here, which put a render-blocking
         third-party request in front of first paint on every page view, for a
         widget nobody sees until they click "Book a call". -->
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N7Z8Q4QF"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
